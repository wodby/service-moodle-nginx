name: moodle-nginx
type: service
from: nginx-proxy
guidance: GUIDANCE.md
fromVersionConstraint: "^1.0.0"
fromVersion: "1.2.3"
title: Nginx (Moodle)

labels:
- moodle

# The Nginx variant of the wodby/moodle image: Moodle's public directory and
# rules, for the Moodle release of the same version.
options:
- version: '5.3'
  default: true
  tag: 5.3-nginx-r4

links:
- name: backend
  title: Moodle
  selectors:
  - type: service
    labels:
    - moodle

# Moodle's rules, from the image. They replace the image's PHP preset, whose
# name makes the image define the PHP-FPM upstream.
configs:
- name: preset
  title: Moodle preset
  filepath: /etc/gotpl/presets/php.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/php.conf.tmpl

env:
- name: NGINX_VHOST_PRESET
  value: php
- name: NGINX_SERVER_ROOT
  value: /var/www/html/public
# Matches the upload limit of the Moodle service.
- name: NGINX_CLIENT_MAX_BODY_SIZE
  value: 256m

workloads:
- name: main
  containers:
  - name: nginx
    image: wodby/moodle
